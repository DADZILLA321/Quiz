<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f1222" />
  <meta name="description" content="Paste your notes or upload a file and get practice questions at the difficulty you choose." />
  <title>Notes2Quiz | Turn your notes into practice questions</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0f1222; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.12); --text:#eef0ff; --muted:#a4a9c9; --accent:#7c83ff; --accent2:#b06cff; --ok:#6ee7a8; --bad:#ff8c9a; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Poppins", system-ui, sans-serif; color: var(--text); background: radial-gradient(800px 500px at 90% -10%, rgba(124,131,255,.25), transparent), radial-gradient(700px 500px at -10% 110%, rgba(176,108,255,.18), transparent), var(--bg); }
    .wrap { max-width: 820px; margin: 0 auto; padding: 28px 16px 50px; }
    header { text-align: center; margin-bottom: 22px; }
    h1 { margin: 0; font-size: 1.9rem; font-weight: 600; }
    h1 span { background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    header p { margin: 6px 0 0; color: var(--muted); font-size: .92rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 14px; backdrop-filter: blur(10px); }
    h2 { margin: 0 0 12px; font-size: .95rem; font-weight: 500; }
    h2 small { color: var(--muted); font-weight: 300; }
    .tabs, .seg { display: flex; gap: 6px; flex-wrap: wrap; }
    button { font: inherit; cursor: pointer; }
    .tab, .seg button { flex: 1; min-width: 90px; padding: 9px 12px; font-size: .84rem; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 12px; transition: .2s; }
    .tab:hover, .seg button:hover { border-color: var(--accent); color: var(--text); }
    .tab.on, .seg button.on { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--accent), var(--accent2)); }
    textarea, select { width: 100%; font: inherit; font-size: .9rem; color: var(--text); background: rgba(0,0,0,.28); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    textarea { min-height: 190px; resize: vertical; margin-top: 12px; line-height: 1.5; }
    textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    select option { color: #111; }
    .count { text-align: right; color: var(--muted); font-size: .74rem; margin-top: 4px; }
    .drop { display: block; margin-top: 12px; padding: 30px 14px; text-align: center; color: var(--muted); font-size: .88rem; border: 2px dashed var(--line); border-radius: 14px; cursor: pointer; transition: .2s; }
    .drop:hover, .drop.over { border-color: var(--accent); color: var(--text); }
    .drop b { display: block; color: var(--text); font-weight: 500; margin-bottom: 4px; }
    .drop input { display: none; }
    .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 18px; }
    .opts .full { grid-column: 1 / -1; }
    .go { width: 100%; padding: 14px; font-size: 1rem; font-weight: 500; color: #fff; border: 0; border-radius: 14px; background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 8px 26px rgba(124,131,255,.35); transition: .2s; }
    .go:hover { transform: translateY(-1px); }
    .go:disabled { opacity: .6; cursor: wait; transform: none; }
    .err { display: none; margin: 0 0 12px; padding: 11px 14px; font-size: .86rem; color: var(--bad); background: rgba(255,140,154,.1); border: 1px solid rgba(255,140,154,.35); border-radius: 12px; }
    .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .bar b { font-weight: 500; }
    .bar .row { display: flex; gap: 6px; flex-wrap: wrap; }
    .mini { padding: 8px 13px; font-size: .8rem; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    .mini:hover { border-color: var(--accent); }
    .q { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .q .meta { display: flex; justify-content: space-between; font-size: .72rem; color: var(--muted); margin-bottom: 6px; }
    .q p { margin: 0 0 12px; line-height: 1.55; font-size: .96rem; }
    .choice { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 11px 13px; font-size: .88rem; color: var(--text); background: rgba(0,0,0,.2); border: 1px solid var(--line); border-radius: 12px; transition: .15s; }
    .choice:hover:not(:disabled) { border-color: var(--accent); }
    .choice:disabled { cursor: default; }
    .choice.right { border-color: var(--ok); background: rgba(110,231,168,.12); }
    .choice.wrong { border-color: var(--bad); background: rgba(255,140,154,.12); }
    .reveal { margin-top: 10px; }
    .answer { display: none; margin-top: 12px; padding: 12px 14px; font-size: .88rem; line-height: 1.55; background: rgba(110,231,168,.08); border-left: 3px solid var(--ok); border-radius: 8px; }
    .answer.show { display: block; }
    .answer em { display: block; margin-top: 6px; color: var(--muted); font-style: normal; font-size: .82rem; }
    .score { color: var(--ok); font-size: .86rem; }
    footer { text-align: center; margin-top: 26px; color: var(--muted); font-size: .76rem; }
    footer b { color: var(--text); font-weight: 500; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { .opts { grid-template-columns: 1fr; } h1 { font-size: 1.6rem; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>📝 Notes<span>2Quiz</span></h1>
      <p>Paste your notes or upload a file, pick the level, and get practice questions.</p>
    </header>

    <section class="card">
      <h2>1. Your notes</h2>
      <div class="tabs">
        <button class="tab on" id="tab-text" type="button">Paste text</button>
        <button class="tab" id="tab-file" type="button">Upload file</button>
      </div>
      <div id="pane-text">
        <textarea id="notes" placeholder="Paste your notes here..."></textarea>
        <div class="count" id="count">0 characters</div>
      </div>
      <div id="pane-file" hidden>
        <label class="drop" id="drop">
          <b id="drop-title">Click to choose a file or drop it here</b>
          <span id="drop-sub">.txt, .md, .pdf or .docx (up to 4 MB)</span>
          <input type="file" id="file" accept=".txt,.md,.pdf,.docx" />
        </label>
      </div>
    </section>

    <section class="card">
      <h2>2. Choose before you generate</h2>
      <div class="opts">
        <div>
          <h2>Difficulty</h2>
          <div class="seg" id="seg-difficulty">
            <button type="button" data-v="easy">Easy</button>
            <button type="button" data-v="medium" class="on">Medium</button>
            <button type="button" data-v="hard">Hard</button>
          </div>
        </div>
        <div>
          <h2>Question type</h2>
          <div class="seg" id="seg-qtype">
            <button type="button" data-v="mcq">MCQ</button>
            <button type="button" data-v="short">Short answer</button>
            <button type="button" data-v="both" class="on">Both</button>
          </div>
        </div>
        <div>
          <h2>How many questions?</h2>
          <div class="seg" id="seg-count">
            <button type="button" data-v="5">5</button>
            <button type="button" data-v="10" class="on">10</button>
            <button type="button" data-v="15">15</button>
          </div>
        </div>
        <div>
          <h2>Language</h2>
          <select id="language">
            <option value="English">English</option>
            <option value="Hinglish">Hinglish</option>
            <option value="Hindi">हिन्दी</option>
          </select>
        </div>
      </div>
    </section>

    <p class="err" id="error" role="alert"></p>
    <button class="go" id="go" type="button">✨ Generate questions</button>

    <section id="result" hidden style="margin-top:22px">
      <div class="bar">
        <div><b id="r-title"></b> <span class="score" id="score"></span></div>
        <div class="row">
          <button class="mini" id="show-all" type="button">Show all answers</button>
          <button class="mini" id="copy" type="button">Copy</button>
          <button class="mini" id="again" type="button">↻ New quiz</button>
        </div>
      </div>
      <div id="questions"></div>
    </section>

    <footer>Built by <b>LayersLab</b> · Questions are made by AI, so please check important answers.</footer>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const choice = { difficulty: "medium", qtype: "both", count: "10" };
    let mode = "text", quiz = [], answered = 0, correct = 0, mcqTotal = 0;

    /* ----- small helper to build elements safely ----- */
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    /* ----- tabs: paste or upload ----- */
    function setMode(m) {
      mode = m;
      $("tab-text").classList.toggle("on", m === "text");
      $("tab-file").classList.toggle("on", m === "file");
      $("pane-text").hidden = m !== "text";
      $("pane-file").hidden = m !== "file";
    }
    $("tab-text").onclick = () => setMode("text");
    $("tab-file").onclick = () => setMode("file");
    $("notes").addEventListener("input", () => { $("count").textContent = $("notes").value.length.toLocaleString() + " characters"; });

    /* ----- file picker and drag/drop ----- */
    function showFile() {
      const f = $("file").files[0];
      $("drop-title").textContent = f ? f.name : "Click to choose a file or drop it here";
      $("drop-sub").textContent = f ? (f.size / 1024 / 1024).toFixed(2) + " MB (click to change)" : ".txt, .md, .pdf or .docx (up to 4 MB)";
    }
    $("file").onchange = showFile;
    ["dragover", "dragenter"].forEach((n) => $("drop").addEventListener(n, (e) => { e.preventDefault(); $("drop").classList.add("over"); }));
    ["dragleave", "drop"].forEach((n) => $("drop").addEventListener(n, () => $("drop").classList.remove("over")));
    $("drop").addEventListener("drop", (e) => { e.preventDefault(); if (e.dataTransfer.files.length) { $("file").files = e.dataTransfer.files; showFile(); } });

    /* ----- option buttons ----- */
    [["seg-difficulty", "difficulty"], ["seg-qtype", "qtype"], ["seg-count", "count"]].forEach(([id, key]) => {
      $(id).addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        choice[key] = b.dataset.v;
        $(id).querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
      });
    });

    function showError(msg) { $("error").textContent = msg; $("error").style.display = msg ? "block" : "none"; }

    /* ----- generate ----- */
    $("go").onclick = async () => {
      showError("");
      const form = new FormData();
      const file = $("file").files[0];
      if (mode === "file") {
        if (!file) return showError("Please choose a file first.");
        if (file.size > 4 * 1024 * 1024) return showError("That file is over 4 MB. Please use a smaller one.");
        form.append("file", file);
      } else {
        if ($("notes").value.trim().length < 80) return showError("Please paste a little more text (at least a few lines).");
        form.append("text", $("notes").value);
      }
      form.append("difficulty", choice.difficulty);
      form.append("qtype", choice.qtype);
      form.append("count", choice.count);
      form.append("language", $("language").value);

      $("go").disabled = true;
      $("go").textContent = "Reading your notes and writing questions...";
      try {
        const res = await fetch("/api/generate", { method: "POST", body: form });
        let data = {};
        try { data = await res.json(); } catch (e) {}
        if (!res.ok) throw new Error(data.error || "The server took too long. Try fewer questions or shorter notes.");
        showQuiz(data);
      } catch (e) {
        showError(e.message || "Something went wrong. Please try again.");
      }
      $("go").disabled = false;
      $("go").textContent = "✨ Generate questions";
    };

    /* ----- show the questions ----- */
    const LEVEL_NAME = { easy: "Easy", medium: "Medium", hard: "Hard" };
    const TYPE_NAME = { mcq: "MCQ", short: "Short answer", both: "MCQ + Short answer" };

    function showQuiz(data) {
      quiz = data.questions;
      answered = 0; correct = 0;
      mcqTotal = quiz.filter((q) => q.type === "mcq").length;
      $("r-title").textContent = `${quiz.length} questions · ${LEVEL_NAME[data.difficulty]} · ${TYPE_NAME[data.qtype]}`;
      $("score").textContent = "";
      const box = $("questions");
      box.innerHTML = "";
      quiz.forEach((q, i) => box.appendChild(buildQuestion(q, i)));
      $("result").hidden = false;
      $("result").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function buildQuestion(q, i) {
      const card = el("div", "q");
      const meta = el("div", "meta");
      meta.appendChild(el("span", "", "Question " + (i + 1)));
      meta.appendChild(el("span", "", q.type === "mcq" ? "MCQ" : "Short answer"));
      card.appendChild(meta);
      card.appendChild(el("p", "", q.question));

      const answer = el("div", "answer");
      if (q.type === "mcq") {
        answer.appendChild(document.createTextNode("Correct answer: " + q.options[q.answer_index]));
      } else {
        answer.appendChild(document.createTextNode(q.answer));
      }
      if (q.explanation) answer.appendChild(el("em", "", q.explanation));

      if (q.type === "mcq") {
        const buttons = q.options.map((text, n) => {
          const b = el("button", "choice", text);
          b.type = "button";
          card.appendChild(b);
          return b;
        });
        buttons.forEach((b, n) => {
          b.onclick = () => {
            if (card.dataset.done) return;
            lockQuestion(card, buttons, q, n);
            answered++;
            if (n === q.answer_index) correct++;
            $("score").textContent = `Score: ${correct}/${answered}`;
          };
        });
        card._reveal = () => { if (!card.dataset.done) lockQuestion(card, buttons, q, -1); };
      } else {
        const b = el("button", "mini reveal", "Show answer");
        b.type = "button";
        b.onclick = () => { answer.classList.toggle("show"); b.textContent = answer.classList.contains("show") ? "Hide answer" : "Show answer"; };
        card.appendChild(b);
        card._reveal = () => { answer.classList.add("show"); b.textContent = "Hide answer"; };
      }
      card.appendChild(answer);
      card._answer = answer;
      return card;
    }

    function lockQuestion(card, buttons, q, picked) {
      card.dataset.done = "1";
      buttons.forEach((b, n) => {
        b.disabled = true;
        if (n === q.answer_index) b.classList.add("right");
        else if (n === picked) b.classList.add("wrong");
      });
      card._answer.classList.add("show");
    }

    $("show-all").onclick = () => { $("questions").childNodes.forEach((c) => c._reveal && c._reveal()); };
    $("again").onclick = () => { $("result").hidden = true; window.scrollTo({ top: 0, behavior: "smooth" }); };

    $("copy").onclick = async () => {
      const lines = quiz.map((q, i) => {
        let t = `${i + 1}. ${q.question}\n`;
        if (q.type === "mcq") {
          q.options.forEach((o, n) => { t += `   ${"ABCD"[n]}) ${o}\n`; });
          t += `   Answer: ${"ABCD"[q.answer_index]}) ${q.options[q.answer_index]}`;
        } else {
          t += `   Answer: ${q.answer}`;
        }
        return t;
      });
      try { await navigator.clipboard.writeText(lines.join("\n\n")); $("copy").textContent = "Copied ✓"; }
      catch (e) { $("copy").textContent = "Could not copy"; }
      setTimeout(() => { $("copy").textContent = "Copy"; }, 1800);
    };
  </script>
</body>
</html>
